name: qt-ci

on:
  workflow_dispatch:
    inputs:
      publish_nightly:
        description: Publish an unsigned nightly prerelease after all checks pass
        type: boolean
        default: false
  pull_request:
    branches:
      - dev
      - main
    paths:
      - ".github/workflows/qt-ci.yml"
      - ".github/workflows/qt-release-candidate.yml"
      - ".github/actionlint.yaml"
      - ".github/scripts/ensure-windows-media-foundation.ps1"
      - "opennow-qt/**"
      - "native/opennow-core/**"
      - "native/opennow-streamer/**"
      - "locales/**"
      - "scripts/**"
      - "package.json"
  push:
    paths:
      - ".github/workflows/qt-ci.yml"
      - ".github/workflows/qt-release-candidate.yml"
      - ".github/actionlint.yaml"
      - ".github/scripts/ensure-windows-media-foundation.ps1"
      - "opennow-qt/**"
      - "native/opennow-core/**"
      - "native/opennow-streamer/**"
      - "locales/**"
      - "scripts/**"
      - "package.json"

concurrency:
  group: qt-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Test release metadata and artifact inventory
        run: |
          python3 -m unittest discover -s opennow-qt/tests -p test_release_metadata.py
          python3 -m unittest discover -s opennow-qt/tests -p test_nightly_release.py
      - name: Record immutable nightly identity
        id: version
        shell: bash
        run: |
          version=$(python3 opennow-qt/packaging/nightly_release.py version \
            --run "$GITHUB_RUN_NUMBER" --attempt "$GITHUB_RUN_ATTEMPT")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

  localization:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run locales:check
      - run: node --test scripts/check-translations.test.mjs

  validate:
    name: ${{ matrix.label }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: blacksmith-8vcpu-ubuntu-2404
            build-parallel: 6
            qt-host: linux
            qt-arch: linux_gcc_64
            package-generator: DEB
            rust-target: ""
            cmake-arch: ""
            linuxdeploy-arch: x86_64
            linuxdeploy-sha256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
            qt-plugin-sha256: 15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724
          - label: linux-arm64
            os: blacksmith-8vcpu-ubuntu-2404-arm
            build-parallel: 6
            qt-host: linux_arm64
            qt-arch: linux_gcc_arm64
            package-generator: DEB
            rust-target: ""
            cmake-arch: ""
            linuxdeploy-arch: aarch64
            linuxdeploy-sha256: 620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff
            qt-plugin-sha256: bf1c24aff6d749b5cf423afad6f15abd4440f81dec1aab95706b25f6667cdcf1
          - label: windows-x64
            os: blacksmith-4vcpu-windows-2025
            build-parallel: 4
            qt-host: windows
            qt-arch: win64_msvc2022_64
            package-generator: ZIP
            rust-target: ""
            cmake-arch: ""
          - label: windows-arm64
            os: blacksmith-4vcpu-windows-2025
            build-parallel: 4
            qt-host: windows
            qt-arch: win64_msvc2022_arm64_cross_compiled
            package-generator: ZIP
            rust-target: aarch64-pc-windows-msvc
            cmake-arch: ARM64

    env:
      CARGO_TERM_COLOR: always
      SDL_VERSION: release-3.2.20
      OPENNOW_BUILD_VERSION: ${{ needs.metadata.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Enable Windows Media Foundation
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/ensure-windows-media-foundation.ps1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Test Windows release package contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: opennow-qt/tests/test_windows_release.ps1

      - name: Test Linux package capability checks
        if: runner.os == 'Linux'
        shell: bash
        run: python3 -m unittest discover -s opennow-qt/tests -p test_linux_package.py

      - name: Add package Rust target
        if: matrix.rust-target != ''
        shell: bash
        run: rustup target add "${{ matrix.rust-target }}"

      - name: Install Windows ARM64 compiler
        if: matrix.label == 'windows-arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installerRoot = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $installPath = & "$installerRoot\vswhere.exe" -latest -products * -property installationPath
          if (-not $installPath) {
            throw "Visual Studio Build Tools installation was not found."
          }
          $compiler = Get-ChildItem "$installPath\VC\Tools\MSVC\*\bin\Hostx64\arm64\cl.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $compiler) {
            $arguments = "modify --installPath `"$installPath`" --quiet --norestart --add Microsoft.VisualStudio.Component.VC.Tools.ARM64"
            $install = Start-Process "$installerRoot\vs_installer.exe" -ArgumentList $arguments -Wait -PassThru
            if ($install.ExitCode -notin 0, 3010) {
              throw "Visual Studio ARM64 compiler installation failed with exit code $($install.ExitCode)."
            }
            $compiler = Get-ChildItem "$installPath\VC\Tools\MSVC\*\bin\Hostx64\arm64\cl.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $compiler) {
            throw "Visual Studio ARM64 compiler is unavailable after installation."
          }
          $linker = Join-Path $compiler.Directory.FullName "link.exe"
          if (-not (Test-Path $linker)) {
            throw "Visual Studio ARM64 linker is unavailable after installation."
          }
          "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Windows ARM64 compiler: $($compiler.FullName)"
          Write-Host "Using Windows ARM64 linker: $linker"

      - name: Setup Windows ARM64 build tools
        if: matrix.label == 'windows-arm64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Install Windows LLVM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install llvm -y --no-progress
          $llvmBin = Join-Path $env:ProgramFiles "LLVM\bin"
          if (-not (Test-Path (Join-Path $llvmBin "clang.exe")) -or
              -not (Test-Path (Join-Path $llvmBin "libclang.dll"))) {
            throw "LLVM installation is missing libclang.dll"
          }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Windows host Qt tools
        if: matrix.label == 'windows-arm64'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtshadertools
          dir: ${{ runner.temp }}/qt-host
          cache: true
          cache-key-prefix: qt-host-windows-x64

      - name: Remember Windows host Qt path
        if: matrix.label == 'windows-arm64'
        shell: bash
        run: echo "OPENNOW_QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: ${{ matrix.qt-host }}
          target: desktop
          arch: ${{ matrix.qt-arch }}
          modules: qtmultimedia qtshadertools
          cache: true
          cache-key-prefix: qt-target-${{ matrix.label }}

      - name: Install Linux media dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libclang-dev \
            libasound2-dev \
            libdbus-1-dev \
            libdrm-dev \
            libgstreamer-plugins-bad1.0-0 \
            libgstreamer-plugins-good1.0-0 \
            libpulse-dev \
            libsecret-1-dev \
            libva-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxrender-dev \
            libxss-dev \
            make \
            nasm \
            pkg-config \
            wayland-protocols

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: qt-ci-${{ matrix.os }}-${{ matrix.label }}
          cache-bin: false
          workspaces: |
            native/opennow-core -> target
            native/opennow-streamer -> target
            native/opennow-core -> ../../build/opennow-qt-release/rust-target
            native/opennow-streamer -> ../../build/opennow-qt-release/streamer-rust-target

      - name: Cache Qt C++ compilation
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639
        with:
          key: qt-ci-${{ matrix.os }}-${{ matrix.label }}
          max-size: 500M

      - name: Cache SDL3 installation
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SDL-install
          key: qt-ci-sdl-v1-${{ matrix.os }}-${{ matrix.label }}-${{ env.SDL_VERSION }}-${{ hashFiles('.github/workflows/qt-ci.yml') }}

      - name: Build SDL3
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch "$SDL_VERSION" https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"
          SDL_CMAKE_ARGS=()
          if [[ "${{ runner.os }}" == "Windows" && -n "${{ matrix.cmake-arch }}" ]]; then
            SDL_CMAKE_ARGS+=("-A" "${{ matrix.cmake-arch }}")
          elif [[ -n "${{ matrix.cmake-arch }}" ]]; then
            SDL_CMAKE_ARGS+=("-DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake-arch }}")
          fi
          cmake -S "$RUNNER_TEMP/SDL" -B "$RUNNER_TEMP/SDL-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_TESTS=OFF \
            "${SDL_CMAKE_ARGS[@]}"
          cmake --build "$RUNNER_TEMP/SDL-build" --config Release --parallel "${{ matrix.build-parallel }}"
          cmake --install "$RUNNER_TEMP/SDL-build" --config Release --prefix "$RUNNER_TEMP/SDL-install"

      - name: Rust format and lint
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo fmt --manifest-path native/opennow-core/Cargo.toml -- --check
          cargo clippy --manifest-path native/opennow-core/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path native/opennow-streamer/Cargo.toml --all -- --check
          cargo clippy --manifest-path native/opennow-streamer/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Lint GitHub workflows
        if: runner.os == 'Linux'
        shell: bash
        run: |
          case "$(uname -m)" in
            x86_64)
              actionlint_arch=amd64
              actionlint_sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              ;;
            aarch64)
              actionlint_arch=arm64
              actionlint_sha256=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
              ;;
            *)
              echo "Unsupported actionlint architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl --fail --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_${actionlint_arch}.tar.gz" \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "$actionlint_sha256  $RUNNER_TEMP/actionlint.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color=false \
            .github/workflows/qt-ci.yml .github/workflows/qt-release-candidate.yml

      - name: Rust tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo test --manifest-path native/opennow-core/Cargo.toml
          cargo test --manifest-path native/opennow-streamer/Cargo.toml --workspace

      - name: Configure Qt release
        shell: bash
        run: |
          OPENNOW_CMAKE_ARGS=()
          if [[ "${{ runner.os }}" == "Windows" && -n "${{ matrix.cmake-arch }}" ]]; then
            OPENNOW_CMAKE_ARGS+=("-A" "${{ matrix.cmake-arch }}")
          elif [[ -n "${{ matrix.cmake-arch }}" ]]; then
            OPENNOW_CMAKE_ARGS+=("-DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake-arch }}")
          fi
          if [[ -n "${{ matrix.rust-target }}" ]]; then
            OPENNOW_CMAKE_ARGS+=("-DOPENNOW_RUST_TARGET=${{ matrix.rust-target }}")
          fi
          if [[ -n "${OPENNOW_QT_HOST_PATH:-}" ]]; then
            OPENNOW_CMAKE_ARGS+=("-DQT_HOST_PATH=${OPENNOW_QT_HOST_PATH}")
          fi
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            OPENNOW_CMAKE_ARGS+=("-DCMAKE_C_COMPILER_LAUNCHER=ccache" "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache")
          fi
          cmake -S opennow-qt -B build/opennow-qt-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENNOW_BUILD_VERSION="$OPENNOW_BUILD_VERSION" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/SDL-install" \
            "${OPENNOW_CMAKE_ARGS[@]}"

      - name: Build Qt release
        shell: bash
        run: cmake --build build/opennow-qt-release --config Release --parallel "${{ matrix.build-parallel }}"

      - name: Test Qt shell
        if: matrix.label != 'windows-arm64'
        shell: bash
        run: ctest --test-dir build/opennow-qt-release -C Release --output-on-failure --parallel 4

      - name: Create unsigned validation package
        shell: bash
        env:
          PACKAGE_GENERATOR: ${{ matrix.package-generator }}
        run: |
          mkdir -p build/qt-packages
          cpack --config build/opennow-qt-release/CPackConfig.cmake \
            -C Release \
            -G "$PACKAGE_GENERATOR" \
            -B build/qt-packages

      - name: Create Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          LINUXDEPLOY_ARCH: ${{ matrix.linuxdeploy-arch }}
          LINUXDEPLOY_SHA256: ${{ matrix.linuxdeploy-sha256 }}
          QT_PLUGIN_SHA256: ${{ matrix.qt-plugin-sha256 }}
        run: |
          export LD_LIBRARY_PATH="$RUNNER_TEMP/SDL-install/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cmake --install build/opennow-qt-release --config Release \
            --prefix "$PWD/build/AppDir/usr"
          deb=$(find build/qt-packages -maxdepth 1 -type f -name '*.deb' -print -quit)
          python3 opennow-qt/packaging/verify_linux_package.py build/AppDir/usr/bin --deb "$deb"
          curl --fail --location --retry 3 \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-${LINUXDEPLOY_ARCH}.AppImage" \
            --output "build/linuxdeploy-${LINUXDEPLOY_ARCH}.AppImage"
          curl --fail --location --retry 3 \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-${LINUXDEPLOY_ARCH}.AppImage" \
            --output "build/linuxdeploy-plugin-qt-${LINUXDEPLOY_ARCH}.AppImage"
          echo "$LINUXDEPLOY_SHA256  build/linuxdeploy-${LINUXDEPLOY_ARCH}.AppImage" | sha256sum --check --strict
          echo "$QT_PLUGIN_SHA256  build/linuxdeploy-plugin-qt-${LINUXDEPLOY_ARCH}.AppImage" | sha256sum --check --strict
          chmod +x "build/linuxdeploy-${LINUXDEPLOY_ARCH}.AppImage" "build/linuxdeploy-plugin-qt-${LINUXDEPLOY_ARCH}.AppImage"
          QMAKE="$QT_ROOT_DIR/bin/qmake" \
          QML_SOURCES_PATHS="$PWD/opennow-qt/qml" \
          OUTPUT="OpenNOW-Qt-${OPENNOW_BUILD_VERSION}-Linux-${{ matrix.linuxdeploy-arch == 'aarch64' && 'arm64' || 'x64' }}.AppImage" \
            "build/linuxdeploy-${LINUXDEPLOY_ARCH}.AppImage" \
              --appdir build/AppDir \
              --desktop-file build/AppDir/usr/share/applications/io.github.opencloudgaming.OpenNOW.desktop \
              --icon-file build/AppDir/usr/share/icons/hicolor/scalable/apps/io.github.opencloudgaming.OpenNOW.svg \
              --library "$(pkg-config --variable=libdir libva)/libva.so.2" \
              --library "$(pkg-config --variable=libdir libva-drm)/libva-drm.so.2" \
              --plugin qt \
              --output appimage
          test -f build/AppDir/usr/lib/libva.so.2
          test -f build/AppDir/usr/lib/libva-drm.so.2
          LD_LIBRARY_PATH="$PWD/build/AppDir/usr/lib:$LD_LIBRARY_PATH" \
            python3 opennow-qt/packaging/verify_linux_package.py build/AppDir/usr/bin
          mv OpenNOW-Qt-*.AppImage build/qt-packages/

      - name: Smoke-test Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          build/qt-packages/OpenNOW-Qt-*.AppImage \
            --smoke-test --allow-multiple-instances --route home --reduced-motion

      - name: Upload unsigned validation package
        uses: actions/upload-artifact@v4
        with:
          name: opennow-qt-${{ matrix.label }}-unsigned
          path: |
            build/qt-packages/*.AppImage
            build/qt-packages/*.deb
            build/qt-packages/*.dmg
            build/qt-packages/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  nightly-inventory:
    name: Verify complete nightly artifact set
    needs: [metadata, localization, validate]
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: opennow-qt-*-unsigned
          path: nightly-artifacts
      - name: Verify all six packages and prepare release checksums
        shell: bash
        run: |
          python3 opennow-qt/packaging/nightly_release.py assemble \
            --source nightly-artifacts --destination nightly-release \
            --version "$RELEASE_VERSION" --commit "$SOURCE_SHA"
          (cd nightly-release && sha256sum --check --strict SHA256SUMS)
      - name: Upload complete unsigned nightly
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: opennow-qt-${{ needs.metadata.outputs.version }}-complete-unsigned
          path: nightly-release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-nightly:
    name: Publish unsigned nightly prerelease
    if: github.event_name == 'workflow_dispatch' && inputs.publish_nightly
    needs: [metadata, nightly-inventory]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: opennow-qt-${{ needs.metadata.outputs.version }}-complete-unsigned
          path: nightly-release
      - name: Verify checksums and prepare unsigned release notes
        shell: bash
        run: |
          (cd nightly-release && sha256sum --check --strict SHA256SUMS)
          cat > nightly-notes.md <<EOF
          Experimental OpenNOW Qt/native nightly from commit \`$SOURCE_SHA\`.

          **All packages are unsigned.** Windows may display a SmartScreen or unknown-publisher warning.
          Windows x64 and ARM64 downloads are portable ZIPs: extract the entire archive and run \`bin/OpenNOW.exe\`.
          Linux AppImages are the recommended portable download; mark the file executable before launching it.
          DEBs require a distribution providing Qt 6.8+ and SDL3; stock Ubuntu 24.04 does not satisfy those requirements.

          These builds have no pinned update-signing key and require manual downloads for updates.
          SHA256SUMS detects corrupted downloads; it is not a cryptographic publisher signature.
          macOS is not included. Windows ARM64 is cross-built, not runtime-tested by CI.
          EOF
      - name: Publish only after the complete upload succeeds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$RELEASE_VERSION" nightly-release/* \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "OpenNOW v$RELEASE_VERSION" --notes-file nightly-notes.md \
            --draft --prerelease --latest=false
          gh release edit "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease --latest=false
