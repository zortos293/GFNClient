<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">One interface. Native underneath.</title>
  <desc id="desc">The Rust application core runs in a separate process and exchanges versioned JSON with Qt. The Qt shell and Rust native streamer share the desktop process and communicate through a versioned C ABI. The streamer publishes native GPU frames for Qt to compose with overlays. Qt owns interface and focus; the core owns accounts, settings, catalog and session preparation; the streamer owns NVST transport, decode, audio, input and recording.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#56e6a5" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1280" height="640" rx="24" fill="#0d1511"/>
  <g font-family="'Trebuchet MS', Lato, sans-serif">
    <text x="48" y="55" fill="#56e6a5" font-family="'Courier New', monospace" font-size="16" letter-spacing="2">UNDER THE HOOD</text>
    <text x="48" y="108" fill="#f1f6ef" font-size="42" font-weight="700" letter-spacing="-1">One interface. Native underneath.</text>
    <rect x="436" y="150" width="796" height="402" rx="18" fill="#14231b" stroke="#304b3a"/>
    <text x="460" y="184" fill="#b9f778" font-family="'Courier New', monospace" font-size="16" letter-spacing="1">DESKTOP PROCESS</text>
    <text x="48" y="184" fill="#acc0b2" font-family="'Courier New', monospace" font-size="16" letter-spacing="1">CORE PROCESS</text>
    <rect x="48" y="214" width="282" height="240" rx="12" fill="#19251f" stroke="#3b5143"/>
    <rect x="460" y="214" width="290" height="240" rx="12" fill="#20372a" stroke="#56e6a5"/>
    <rect x="902" y="214" width="306" height="240" rx="12" fill="#19251f" stroke="#3b5143"/>
    <g font-size="30" font-weight="700" fill="#f1f6ef">
      <text x="72" y="262">Application core</text>
      <text x="484" y="262">Qt shell</text>
      <text x="926" y="262">Native streamer</text>
    </g>
    <g font-family="'Courier New', monospace" font-size="16" fill="#56e6a5" letter-spacing="1">
      <text x="72" y="294">RUST</text>
      <text x="484" y="294">C++ / QML</text>
      <text x="926" y="294">RUST / NVST</text>
    </g>
    <g font-size="21" fill="#c2d0c7">
      <text x="72" y="345">Accounts &amp; settings</text>
      <text x="72" y="379">Catalog services</text>
      <text x="72" y="413">Session preparation</text>
      <text x="484" y="345">Windows &amp; navigation</text>
      <text x="484" y="379">Focus &amp; overlays</text>
      <text x="484" y="413">Video composition</text>
      <text x="926" y="345">Transport &amp; decode</text>
      <text x="926" y="379">Audio &amp; gameplay input</text>
      <text x="926" y="413">Source-stream recording</text>
    </g>
    <g fill="none" stroke="#56e6a5" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)">
      <path d="M342 336H448"/>
      <path d="M762 336H890"/>
    </g>
    <g text-anchor="middle" fill="#d6e4da" font-family="'Courier New', monospace" font-size="17">
      <text x="395" y="290">Versioned</text>
      <text x="395" y="315">JSON</text>
      <text x="826" y="290">Versioned</text>
      <text x="826" y="315">C ABI</text>
    </g>
    <path d="M1054 466V510H604V466" fill="none" stroke="#56e6a5" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="727" y="493" width="205" height="32" rx="6" fill="#14231b"/>
    <text x="829" y="515" text-anchor="middle" fill="#b9f778" font-family="'Courier New', monospace" font-size="18">Native GPU frames</text>
    <text x="48" y="597" fill="#acc0b2" font-size="21">Qt composes the video and overlays in one window. No embedded browser runtime.</text>
  </g>
</svg>
