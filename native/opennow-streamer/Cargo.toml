[workspace]
members = [
    "crates/opennow-streamer",
    "crates/opennow-streamer-core",
    "crates/opennow-streamer-platform",
    "crates/opennow-streamer-protocol",
    "crates/opennow-streamer-transport",
]
default-members = ["crates/opennow-streamer"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
str0m = { version = "0.23", default-features = false, features = ["rust-crypto"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
